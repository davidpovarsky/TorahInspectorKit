name: TorahInspectorKit iPadOS 27 Side Sheet

on:
  workflow_dispatch:
  push:
    branches:
      - feature/native-ios27-torah-side-sheet-2026-10-20

permissions:
  contents: read

concurrency:
  group: torah-inspector-kit-ios27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-native-sheet:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          swift --version

      - name: Run package tests
        run: |
          mkdir -p logs
          set -o pipefail
          swift test 2>&1 | tee logs/swift-test.log

      - name: Generate demonstration project
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd Demo
          xcodegen generate

      - name: Select and boot iPadOS 27 simulator
        run: |
          set -euo pipefail
          mkdir -p logs results screenshots
          DEVICE_ID="$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          matches = [
              device
              for runtime, devices in data["devices"].items()
              if "iOS-27" in runtime
              for device in devices
              if device["name"].startswith("iPad")
          ]
          if not matches:
              raise SystemExit("No available iPadOS 27 simulator")
          print(matches[0]["udid"])
          PY
          )"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Run iPadOS 27 UI tests
        id: ui_tests
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os
          import signal
          import subprocess
          import sys
          import time
          from pathlib import Path

          command = [
              'xcodebuild',
              '-project', 'Demo/TorahInspectorSheetDemo.xcodeproj',
              '-scheme', 'TorahInspectorSheetDemo',
              '-destination', f"platform=iOS Simulator,id={os.environ['DEVICE_ID']}",
              '-resultBundlePath', 'results/TorahInspectorSheetDemo.xcresult',
              '-collect-test-diagnostics', 'never',
              'test',
          ]
          log_path = Path('logs/ui-test.log')
          timed_out = False
          suite_passed = False
          with log_path.open('w', encoding='utf-8') as log:
              process = subprocess.Popen(
                  command,
                  stdout=log,
                  stderr=subprocess.STDOUT,
                  text=True,
                  start_new_session=True,
              )
              deadline = time.monotonic() + 900
              while process.poll() is None and time.monotonic() < deadline:
                  time.sleep(5)
                  output = log_path.read_text(encoding='utf-8', errors='replace')
                  suite_passed = (
                      "Test Suite 'All tests' passed" in output
                      and 'Executed 1 test, with 0 failures' in output
                  )
                  if suite_passed:
                      break

              if process.poll() is None:
                  timed_out = not suite_passed
                  os.killpg(process.pid, signal.SIGTERM)
                  try:
                      return_code = process.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      return_code = process.wait()
              else:
                  return_code = process.returncode

          output = log_path.read_text(encoding='utf-8', errors='replace')
          sys.stdout.write(output)
          suite_passed = suite_passed or (
              "Test Suite 'All tests' passed" in output
              and 'Executed 1 test, with 0 failures' in output
          )
          if suite_passed:
              print('xcodebuild watchdog: verified passing-suite evidence; accepting the UI test.')
              raise SystemExit(0)
          if timed_out or return_code != 0:
              raise SystemExit(return_code or 1)
          PY

      - name: Capture three Hebrew RTL detents
        if: always()
        run: |
          set -euo pipefail
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/TorahInspectorSheetDemo.app' -print -quit)"
          test -n "$APP_PATH"
          for DETENT in peek medium large; do
            xcrun simctl boot "$DEVICE_ID" || true
            xcrun simctl bootstatus "$DEVICE_ID" -b
            xcrun simctl install "$DEVICE_ID" "$APP_PATH"
            xcrun simctl launch --terminate-running-process "$DEVICE_ID" \
              com.davidpovarsky.TorahInspectorSheetDemo --detent "$DETENT"
            sleep 3
            xcrun simctl io "$DEVICE_ID" screenshot "screenshots/torah-inspector-${DETENT}-hebrew-rtl.png"
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TorahInspectorKit-iPadOS27-Hebrew-RTL-Screenshots
          if-no-files-found: error
          path: screenshots/*.png

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TorahInspectorKit-iPadOS27-Test-Results
          if-no-files-found: error
          path: results/

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TorahInspectorKit-iPadOS27-Logs
          if-no-files-found: error
          path: logs/

      - name: Enforce UI test outcome after publishing evidence
        if: always() && steps.ui_tests.outcome != 'success'
        run: |
          echo 'The UI test did not produce verified passing-suite evidence.'
          exit 1
